name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Unzip project
        run: unzip -qo ./*.zip

      - name: Use Gradle 9.7.0
        working-directory: elemental-arsenal
        run: sed -i 's/gradle-9.5.1-bin/gradle-9.7.0-bin/' gradle/wrapper/gradle-wrapper.properties

      - name: Build
        working-directory: elemental-arsenal
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: elementalarsenal-jar
          path: |
            elemental-arsenal/build/libs/*.jar
            !elemental-arsenal/build/libs/*-sources.jar
